name: Web deploy (production)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built image to production
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Dockerfile runs lint, typecheck, unit tests, and both API suites.
      - run: python3 -m unittest discover -s deploy/production -p 'test_*.py'
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: "."
          file: "Dockerfile"
          platforms: linux/amd64
          push: false

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.result.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Dockerfile checks must pass before this image can be published.
      - run: python3 -m unittest discover -s deploy/production -p 'test_*.py'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: image
        with:
          context: "."
          file: "Dockerfile"
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hashimkarim/themespace:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web-deploy-production
          cache-to: type=gha,mode=max,scope=web-deploy-production
      - name: Record the exact built image
        id: result
        env:
          IMAGE: ghcr.io/hashimkarim/themespace
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$DIGEST"
          printf 'image_ref=%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && false) ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ["ubuntu-24.04"]
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull the image and update the selected Compose service
        env:
          WEB_DEPLOY_IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          WEB_DEPLOY_HOST: ${{ vars.WEB_DEPLOY_HOST }}
          WEB_DEPLOY_PORT: ${{ vars.WEB_DEPLOY_PORT }}
          WEB_DEPLOY_USER: ${{ vars.WEB_DEPLOY_USER }}
          WEB_DEPLOY_ROOT: ${{ vars.WEB_DEPLOY_ROOT }}
          WEB_DEPLOY_SUDO: ${{ vars.WEB_DEPLOY_SUDO }}
          WEB_DEPLOY_SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          WEB_DEPLOY_KNOWN_HOSTS: ${{ secrets.WEB_DEPLOY_KNOWN_HOSTS }}
          WEB_DEPLOY_REGISTRY_USER: ${{ secrets.WEB_DEPLOY_REGISTRY_USER || github.actor }}
          WEB_DEPLOY_REGISTRY_TOKEN: ${{ secrets.WEB_DEPLOY_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 deploy/production/ci.py
